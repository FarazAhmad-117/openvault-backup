name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the installable zip.
# Stable download link (always the newest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/openvault-backup.zip

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version:[[:space:]]*//p' openvault-backup.php | head -n1 | tr -d '\r')
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '\r')
          echo "tag=$TAG header=$HEADER readme=$STABLE"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$STABLE" ] || { echo "::error::Tag, plugin header Version and readme.txt Stable tag must all match."; exit 1; }

      - name: Gate on two real environments
        run: bash tests/matrix/run.sh --jobs 2 min-supported php84

      - name: Build the zip
        run: sh bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/openvault-backup.zip" \
            "dist/openvault-backup-$VERSION.zip" \
            "dist/openvault-backup-$VERSION.zip.sha256" \
            --title "OpenVault Backup $VERSION" \
            --generate-notes \
            --verify-tag
